<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Área - Power BI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .chart-container {
            width: 80%;
            margin: auto;
        }
    </style>
</head>
<body>

    <h2>Gráfico de Área: Total Conferido x Total Separado</h2>
    <div class="chart-container">
        <canvas id="areaChart"></canvas>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const ctx = document.getElementById("areaChart").getContext("2d");

            const data = {
                labels: ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"], // Nome abreviado dos dias
                datasets: [
                    {
                        label: "Total Conferido",
                        data: [120, 150, 130, 180, 200, 220, 250], // Substitua pelos dados reais do Power BI
                        backgroundColor: "rgba(54, 162, 235, 0.3)",
                        borderColor: "RGBA(153, 50, 204, 1)",
                        borderWidth: 2,
                        fill: true
                    },
                    {
                        label: "Total Separado",
                        data: [110, 140, 120, 160, 190, 210, 240], // Substitua pelos dados reais do Power BI
                        backgroundColor: "rgba(255, 99, 132, 0.3)",
                        borderColor: "rgba(255, 99, 132, 1)",
                        borderWidth: 2,
                        fill: true
                    }
                ]
            };

            const config = {
                type: "line",
                data: data,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: "top"
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: "Dias da Semana"
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: "Quantidade"
                            }
                        }
                    }
                }
            };

            new Chart(ctx, config);
        });
    </script>

</body>
</html>
