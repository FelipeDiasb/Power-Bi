<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
  viewBox="0 0 1200 600" preserveAspectRatio="none" 
  style="position: absolute; top: 0; width: 100%; height: 100vh; background: #ffffff; overflow: hidden;">

  <defs>
    <linearGradient id="gradient1" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#F09819" offset="0"></stop>
      <stop stop-color="#FFD700" offset="-3"></stop>
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#F09819" offset="-3"></stop>
      <stop stop-color="#F0E68C" offset="-5"></stop>
    </linearGradient>
    
   <!-- <linearGradient id="gradient3" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#FDD835" offset="0"></stop>
      <stop stop-color="#FF6F00" offset="1"></stop>
    </linearGradient>
    -->
  </defs>

  <g transform="rotate(180, 600, 300)">  <!-- INVERTE TODA A IMAGEM -->

    <!-- Onda 1 -->
    <path fill="url(#gradient1)" opacity="0.3" d="M0 220 Q150 260 300 220 T600 220 T900 220 T1200 220 V0 H0 Z">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" direction="alternate"
        values="
          M0 220 Q150 260 300 220 T600 220 T900 220 T1200 220 V0 H0 Z;
          M0 230 Q150 280 300 230 T600 230 T900 230 T1200 230 V0 H0 Z;
          M0 220 Q150 260 300 220 T600 220 T900 220 T1200 220 V0 H0 Z">
      </animate>
    </path>

    <!-- Onda 2 -->
    <path fill="url(#gradient2)" opacity="0.3" d="M0 200 Q200 230 400 200 T800 200 T1200 200 V0 H0 Z">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" direction="alternate"
        values="
          M0 200 Q200 230 400 200 T800 200 T1200 200 V0 H0 Z;
          M0 210 Q200 250 400 210 T800 210 T1200 210 V0 H0 Z;
          M0 200 Q200 230 400 200 T800 200 T1200 200 V0 H0 Z">
      </animate>
    </path>

   <!--- Onda 3 (nova)
    <path fill="url(#gradient3)" opacity="0.3" d="M0 180 Q250 210 500 180 T1000 180 T1200 180 V0 H0 Z">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" direction="alternate"
        values="
          M0 180 Q250 210 500 180 T1000 180 T1200 180 V0 H0 Z;
          M0 170 Q250 230 500 170 T1000 170 T1200 170 V0 H0 Z;
          M0 180 Q250 210 500 180 T1000 180 T1200 180 V0 H0 Z">
      </animate>
    </path>
    -->
  </g> <!-- Fim do grupo transformado -->

</svg>
